include classpath("application.conf")

node-address {
  protocol = http
  host = sqs-local
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  ReservasQueue {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
  }
}
